version: '3.8'

services:
  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-latest}
    container_name: jellyfin
    restart: ${RESTART_POLICY:-unless-stopped}
    
    # Network configuration
    network_mode: bridge
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
      - "${JELLYFIN_HTTPS_PORT:-8920}:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    
    # Volume mounts
    volumes:
      - ${CONFIG_DIR:-$HOME/jellyfin-config}/config:/config
      - ${CONFIG_DIR:-$HOME/jellyfin-config}/cache:/cache
      - ${MEDIA_DIR:-$HOME/Media}:/media:ro
      - /tmp/jellyfin-transcode:/transcode
    
    # Environment variables
    environment:
      - TZ=${TZ:-Asia/Kolkata}
      - JELLYFIN_PublishedServerUrl=${PUBLISHED_SERVER_URL:-http://localhost:8096}
      - JELLYFIN_CACHE_DIR=/cache
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_DATA_DIR=/config/data
      - JELLYFIN_LOG_DIR=/config/log
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - jellyfin-network

  # AI Assistant with Ollama
  ollama:
    image: ollama/ollama:latest
    container_name: jellyfin-ai
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${CONFIG_DIR:-$HOME/jellyfin-config}/ollama:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jellyfin-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # AI Web UI (Optional - for chatting with AI)
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: jellyfin-ai-chat
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - ${CONFIG_DIR:-$HOME/jellyfin-config}/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_NAME=Jellyfin AI Assistant
    depends_on:
      - ollama
    networks:
      - jellyfin-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  jellyfin-network:
    name: jellyfin-network
    driver: bridge
